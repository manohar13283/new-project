apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard
  namespace: canteen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-dashboard
  template:
    metadata:
      labels:
        app: admin-dashboard
    spec:
      containers:
        - name: admin-dashboard
          image: myunioncanteen/admin-dashboard:1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin-dashboard
  namespace: canteen
spec:
  selector:
    app: admin-dashboard
  ports:
    - port: 80
      targetPort: 80
