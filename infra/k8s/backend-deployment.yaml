apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: canteen
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: myunioncanteen/backend:1.0.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: canteen-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /api/v1
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: canteen
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 3000
