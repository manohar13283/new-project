# Copy to secrets.yaml, fill in real values, and NEVER commit the filled-in version.
apiVersion: v1
kind: Secret
metadata:
  name: canteen-secrets
  namespace: canteen
type: Opaque
stringData:
  DATABASE_URL: "postgres://canteen:REPLACE_ME@postgres:5432/canteen"
  REDIS_URL: "redis://redis:6379"
  JWT_ACCESS_SECRET: "REPLACE_ME"
  JWT_REFRESH_SECRET: "REPLACE_ME"
  OTP_PROVIDER_API_KEY: "REPLACE_ME"
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  ADMIN_API_TOKEN: "REPLACE_ME" # long-lived service token for the monthly-coupon-regeneration CronJob
